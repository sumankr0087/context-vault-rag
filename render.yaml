# Render.com free deployment for the DocuSense backend.
# 1. Push to GitHub (done).
# 2. render.com -> New -> Blueprint -> pick this repo.
# 3. Add GROQ_API_KEY in the dashboard.
services:
  - type: web
    name: context-vault-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: FASTEMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: DATA_DIR
        value: /app/data
