# Render.com free deployment for the ContextVault backend.
# 1. Push to GitHub (done).
# 2. render.com -> New -> Blueprint -> pick this repo.
# 3. Add GROQ_API_KEY in the dashboard.
services:
  - type: web
    name: context-vault-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: HF_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: DATA_DIR
        value: /app/data
